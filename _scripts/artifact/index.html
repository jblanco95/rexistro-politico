<meta charset="utf-8">
<title>Rexistro Político Galego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap">
<style>
/* Layout: ficha de arquivo — barra de busca fixa arriba, lista de resultados como índice; páxina de persoa como expediente con secciones por fonte */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#1b2326; --muted:#5b676b; --line:#d9ddd8; --soft:#eaece7;
  --accent:#1d5c74; --accent-ink:#ffffff; --accent-soft:#dcebf0;
  --ok:#2f6b3c; --ok-soft:#e0eedf; --warn:#8a5a12; --warn-soft:#f6ead2;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181a; --surface:#192124; --ink:#e4e9e7; --muted:#97a3a6; --line:#2c373a; --soft:#202a2d;
  --accent:#6fb3cc; --accent-ink:#0d1a20; --accent-soft:#1d3640;
  --ok:#8cc79a; --ok-soft:#1e3324; --warn:#e2b56a; --warn-soft:#3a2e17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181a; --surface:#192124; --ink:#e4e9e7; --muted:#97a3a6; --line:#2c373a; --soft:#202a2d;
  --accent:#6fb3cc; --accent-ink:#0d1a20; --accent-soft:#1d3640;
  --ok:#8cc79a; --ok-soft:#1e3324; --warn:#e2b56a; --warn-soft:#3a2e17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-weight:650;font-size:1.25rem;letter-spacing:-.01em}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.searchbox{flex:1 1 320px;display:flex;gap:8px;min-width:0}
.searchbox input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px 14px}
.filters select{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:100%}
.btn{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
main{padding-block:16px 48px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.summary strong{color:var(--ink);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row a.name{font-family:var(--f-display);font-weight:650;font-size:1.08rem;text-decoration:none;color:var(--ink)}
.row a.name:hover{color:var(--accent);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;line-height:1.3;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid transparent;max-width:100%}
.chip .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip.x{background:var(--accent-soft)}
.chip.el{background:var(--ok-soft)}
.chip.el .k{color:var(--ok)}
.chip.past{background:transparent;border-color:var(--line);color:var(--muted)}
.lastp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:.95rem}
.lastp .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lastp b{font-weight:600}
.lastp .src{color:var(--muted);font-size:.82rem}
.more{display:flex;justify-content:center;padding:18px}
.empty{padding:32px 4px;color:var(--muted)}
/* person page */
.crumbs{font-size:.85rem;margin-bottom:12px}
.ph{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ph h1{font-family:var(--f-display);font-weight:650;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.85rem}
.meta .id{font-family:var(--f-mono)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:28px;padding-top:20px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
section.blk{display:grid;gap:10px;margin-bottom:26px}
section.blk h2{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
@media (max-width:480px){.ev{grid-template-columns:minmax(0,1fr);gap:2px}}
.ev .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ev .what{font-weight:600}
.ev .sub{color:var(--muted);font-size:.86rem}
.ev .links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;margin-top:4px}
.tenure{position:relative;height:6px;border-radius:3px;background:var(--soft);margin-top:8px;overflow:hidden}
.tenure b{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted);z-index:1}
.tenure i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
.tenure-axis{position:relative;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;vertical-align:1px;margin-left:6px}
.badge.on{background:var(--ok-soft);color:var(--ok)}
.badge.off{background:var(--soft);color:var(--muted)}
.bio{font-size:.95rem;max-width:65ch;white-space:pre-line}
.biosrc{display:grid;gap:6px}
.biosrc+.biosrc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.biosrc h3{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.biosrc .bio{margin:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:.85rem}
.note b{color:var(--warn)}
aside .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
aside dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:.86rem}
aside dt{color:var(--muted)}
aside dd{margin:0;font-variant-numeric:tabular-nums}
.corp{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.86rem}
.corp li{display:flex;justify-content:space-between;gap:10px}
.cmp{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:320px}
.cmp th,.cmp td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.cmp th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:right}
.res td:not(:first-child){white-space:nowrap}
.res td .cand{font-size:.72rem;color:var(--muted);max-width:34ch;white-space:normal}
.res tr.hl td{background:var(--accent-soft)}
.res .barcol{width:28%;min-width:80px}
@media (max-width:560px){.res .barcol{display:none}.res td .cand{display:none}}
.res .bar{display:block;height:8px;border-radius:2px}
.res tfoot td{font-weight:600;border-bottom:0}
.seats{display:flex;flex-wrap:wrap;gap:3px}
.seats i{display:block;width:14px;height:14px;border-radius:3px}
dl.stats{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 6px;font-size:.86rem}
dl.stats div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
dl.stats dt{color:var(--muted)} dl.stats dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.cmp .up{color:var(--ok)} .cmp .down{color:var(--warn)}
.eltabs{display:flex;flex-wrap:wrap;gap:0 6px;border-bottom:1px solid var(--line);margin:0 0 8px}
.eltabs button{font:inherit;font-size:.8rem;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:6px 4px 7px;color:var(--muted);cursor:pointer;text-align:left}
.eltabs button:hover{color:var(--ink)}
.eltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.nelist{display:grid;gap:10px;max-height:70vh;overflow:auto;padding-right:4px;align-content:start}
.negrp .neh,.negrp>summary{font-size:.8rem;font-weight:600;margin:2px 0 4px}
.negrp>summary,.nesec>summary{cursor:pointer}
.nesub{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 2px}
.nenote{color:var(--muted);font-size:.78rem;margin:0}
a.nenote{color:var(--accent)}
.nesec>summary{font-size:.86rem;padding:4px 0}
.nesec[open]{display:grid;gap:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.corp li span{color:var(--muted);font-size:.78rem;text-align:right}
.party-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.party-bar i{display:block;height:100%}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;padding-block:18px 32px}
footer ul{margin:6px 0 0;padding-left:18px}
/* fontes despregables, unións e revisión (antes no <head>, que a publicación substitúe) */
details.fontes>summary{cursor:pointer;list-style:none}details.fontes>summary::-webkit-details-marker{display:none}details.fontes>summary::before{content:'▸';display:inline-block;width:1em;transition:transform .15s}details.fontes[open]>summary::before{transform:rotate(90deg)}
.unionp .uinput,.uinput{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%;max-width:420px}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
.urow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.uc{min-width:0}.uc ul{margin:4px 0 0;padding-left:18px;font-size:.82rem;color:var(--muted)}.uc .more{list-style:none;margin-left:-18px}.uc .id{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.revr{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;margin-bottom:10px}
.revm{font-size:.82rem;color:var(--muted);margin-bottom:8px}.revm .tag{margin-left:0;margin-right:6px}
.revp{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:640px){.revp{grid-template-columns:1fr}}
.reva{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn.warnb{border-color:var(--warn);color:var(--warn)}.btn:disabled{opacity:.6;cursor:default}
.circsel{font:inherit;font-size:.8rem;padding:2px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:220px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.phrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phrow h1{margin-right:auto}
.sharebtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.sharebtn:hover{border-color:var(--ink)}
.sharebtn:focus-visible,.sharerow button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sharebox{margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:560px}
.sharebox label{display:block;font-size:.8rem;margin-bottom:6px}
.sharerow{display:flex;gap:6px}
.sharerow input{flex:1;min-width:0;font:inherit;font-size:.85rem;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink)}
.sharerow button{font:inherit;font-size:.85rem;padding:5px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.sharemsg{display:block;font-size:.78rem;margin-top:6px;min-height:1em}
.circfind{display:inline-block}
.circsearch{font:inherit;font-size:.8rem;padding:2px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);width:220px;max-width:100%}
.circsearch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.errbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.errbtn:hover{border-color:var(--ink)}
.errbtn:focus-visible,.errdlg button:focus-visible,.errdlg a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.errfoot{margin:0 0 10px}
.errdlg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:18px 20px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
.errdlg::backdrop{background:rgba(0,0,0,.35)}
.errdlg h2{margin:0 0 4px;font-size:1.1rem}
.errdlg .ctx{font-size:.8rem;color:var(--muted);margin:0 0 12px;word-break:break-word}
.errdlg label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px}
.errdlg label small{font-weight:400;color:var(--muted)}
.errdlg select,.errdlg textarea,.errdlg input{width:100%;box-sizing:border-box;font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink)}
.errdlg textarea{min-height:84px;resize:vertical}
.errdlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.errdlg a.btn{text-decoration:none;display:inline-block}
.errdlg a.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.errdlg a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.errdlg .hint{font-size:.78rem;color:var(--muted);margin:12px 0 0}
.errdlg .msg{font-size:.78rem;min-height:1em;margin-top:6px}
.card[hidden]{display:none!important}
/* v87: páxinas territoriais */
.mx{font-size:.82rem;min-width:0}.mx th,.mx td{padding:5px 8px;white-space:nowrap}.mx th a{color:inherit}.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--bg);z-index:1}.mx tr.mxe td{color:var(--muted);border-bottom:0;font-size:.78rem}.mx tr.mxe:first-of-type td{border-top:1px solid var(--line)}
.tnote{color:var(--muted);font-size:.8rem;margin:0}
.tnav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem}
.terr{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:.85rem;margin:0 0 10px}.terr .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctab th,.ctab td{text-align:left!important;vertical-align:top}.ctab td:last-child,.ctab th:last-child{text-align:right!important}.ctab td:first-child{white-space:nowrap}.ctabm td:last-child,.ctabm th:last-child{text-align:left!important}.ctab .chips{gap:4px}.ctab .chip{font-size:.74rem;padding:2px 7px}
html{scroll-padding-top:90px}
/* v89: mapa */
/* v107: no móbil (unha columna), o mapa do panel lateral vai antes do contido; o resto do panel segue ao final */
@media (max-width:820px){.grid>aside:has(>.card [data-map]){display:contents!important}.grid>aside>.card:has([data-map]){order:-1}}
.tmap{position:relative}.tmapsvg{display:block;width:100%;height:auto}.tmap path{vector-effect:non-scaling-stroke}
.mf path{fill:var(--surface);stroke:var(--ink);stroke-width:.6px;transition:fill .1s}.mf.mhas path{fill:var(--soft)}.mf:hover path,a.mf:focus path{fill:var(--line)}a.mf:focus-visible path{stroke-width:2.2px}a.mf{outline:none}.mf.mhl path{fill:var(--ink)}.mctx{fill:none;stroke:var(--line);stroke-width:.6px;pointer-events:none}.mover{fill:none;stroke:var(--ink);stroke-width:1.5px;pointer-events:none}.mprov{fill:none;stroke:var(--muted);stroke-width:.35px;pointer-events:none}.mcb{fill:none;stroke:var(--muted);stroke-width:.8px;pointer-events:none}
.mlab{font-size:.85rem;color:var(--muted);min-height:1.4em;margin-top:4px}
.pendnote{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line,#ccc);border-left:4px solid var(--ink,#111);border-radius:6px;font-size:.9rem;line-height:1.45}
.pcands{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcand{border:1px solid var(--line,#ddd);border-radius:8px;padding:10px 12px;min-width:0}
.pcand>summary{cursor:pointer;line-height:1.35}
.pch{line-height:1.35;margin-bottom:6px}
.plist{margin:6px 0 0;padding-left:1.6em;font-size:.9rem}
.plist li{margin:2px 0}
.psup{font-size:.8rem;color:var(--muted);margin:1px 0 4px}
.pmeta{color:var(--muted);font-size:.8rem}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio"><b>Rexistro Político Galego</b><span>Cargos públicos e candidaturas</span></a>
    <div class="searchbox" role="search">
      <label for="q" class="sr" hidden>Buscar</label>
      <input id="q" type="search" placeholder="Busca por nome, concello, partido, cargo, consellería…" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap" id="foot"></footer>
<dialog class="errdlg" id="errdlg" aria-labelledby="errh">
  <h2 id="errh">Informar dun erro</h2>
  <p class="ctx" id="errctx"></p>
  <label for="errtipo">Tipo de erro</label>
  <select id="errtipo">
    <option>Nome mal escrito</option>
    <option>Cargo, data ou mandato incorrecto</option>
    <option>Partido ou candidatura incorrecta</option>
    <option>Persoa duplicada ou fichas mesturadas</option>
    <option>Falta un dato</option>
    <option>Outro</option>
  </select>
  <label for="errque">Que está mal? <small>(obrigatorio)</small></label>
  <textarea id="errque" maxlength="1200"></textarea>
  <label for="errok">Cal sería o dato correcto? <small>(opcional)</small></label>
  <input id="errok" maxlength="300">
  <label for="errfonte">Fonte <small>(ligazón ou documento, opcional)</small></label>
  <input id="errfonte" maxlength="300">
  <div class="acts">
    <a class="btn pri" id="errsend" target="_blank" rel="noopener" aria-disabled="true">Abrir o correo</a>
    <button type="button" class="btn" id="errcopy">Copiar o texto</button>
    <button type="button" class="btn" id="errclose">Pechar</button>
  </div>
  <div class="msg" id="errmsg" role="status"></div>
  <p class="hint" id="errhint"></p>
</dialog>

<script>
(function(){
const $=s=>document.querySelector(s);

  const T0=Date.parse(LL[0][1]), T1=KEND;
  const a=Math.max(T0, r.i?Date.parse(r.i):T0), b=r.f?Date.parse(r.f):T1;
  const pc=t=>((t-T0)/(T1-T0)*100);
  const L=pc(a), W=Math.max(.8,pc(b)-L);
  const marks=LL.slice(1).map(([n,d])=>`<b style="left:${pc(Date.parse(d)).toFixed(2)}%"></b>`).join('');
  const labs=LL.map(([n,d],i)=>{const x0=pc(Date.parse(d)), x1=i<LL.length-1?pc(Date.parse(LL[i+1][1])):100; return `<span style="position:absolute;left:${((x0+x1)/2).toFixed(2)}%;transform:translateX(-50%)" title="${n} lexislatura (eleccións do ${fmtD(d)})">${n}</span>`;}).join('');
  return `<div class="tenure" title="Período no cargo (${fmtD(LL[0][1])} – outubro 2026), con marcas nas eleccións autonómicas"><i style="left:${L.toFixed(2)}%;width:${W.toFixed(2)}%"></i>${marks}</div><div class="tenure-axis" style="height:1.1em">${labs}</div>`;
}
function tenure(r){

function lastParty(p){
  let best=null;
  for(const r of p.r){
    const sg=r.t==='L'||r.t==='D'?r.pa:r.t==='A'?r.ls:r.sg; if(!sg) continue;
    const d=r.t==='A'||r.t==='D'?r.i:r.t==='M'?DTE[r.y]:iso(r.d); if(!d) continue;
    if(!best||d>best.d) best={d,sg,r};
  }
  if(!best) return null;
  const r=best.r, src=r.t==='U'?'Europeas '+r.d.slice(0,4):r.t==='G'?'Congreso '+glab(gk(r)):r.t==='N'?'Senado '+glab(gk(r)):r.t==='C'?(r.e==='Parlament de Catalunya'?'Parlament de Catalunya ':'Autonómicas ')+r.d.slice(0,4):r.t==='M'?'Municipais '+r.y+(r.m?' · '+r.m:''):r.t==='L'?'Corporación 2023 · '+(r.m||''):r.t==='D'?'Deputación de '+r.pr+' '+r.mn:'Alcaldía '+(r.mn||'')+(r.m?' · '+r.m:'');
  const sg=(best.sg.length===11&&r.ca&&r.ca.length<=45)?r.ca:best.sg;  // siglas truncadas a 11 caracteres na fonte (ex. "AHORA REPÚB")

}

const PCOL=['#6f7c85','#9a8a76','#7d6b91','#8a6d1f','#4f6f7a','#a0705a','#5f7f6a','#8c8c8c'];
let CMAP={};
const pkey=s=>norm(s).replace(/ /g,'');
function pcol(k){ k=pkey(k); const f=PRULES.find(([re])=>re.test(k)); if(f) return f[1]; if(!(k in CMAP)) CMAP[k]=PCOL[Object.keys(CMAP).length%PCOL.length]; return CMAP[k]; }
function corpBlock(ine,hl,limit){
  const ids=DATA.corp[ine]||[]; const rows=[];
  ids.forEach(id=>{const p=BYID[id]; p.r.filter(r=>r.t==='L'&&r.ine===ine).forEach(r=>rows.push({p,r}))});
  rows.sort((a,b)=>rankLocal[a.r.c]-rankLocal[b.r.c]||a.r.pa.localeCompare(b.r.pa)||a.p.n.localeCompare(b.p.n,'gl'));
  const m=rows[0]?.r; if(!m) return '';
  const byP={}; rows.forEach(x=>byP[x.r.pa]=(byP[x.r.pa]||0)+1);
  const pe=Object.entries(byP).sort((a,b)=>b[1]-a[1]);
  const bar=`<div class="party-bar" role="img" aria-label="Composición: ${pe.map(([k,v])=>k+' '+v).join(', ')}">${pe.map(([k,v],i)=>`<i style="width:${v/rows.length*100}%;background:${pcol(k)}" title="${esc(k)}: ${v}"></i>`).join('')}</div>
    <div class="chips">${pe.map(([k,v],i)=>`<span class="chip"><i style="width:8px;height:8px;border-radius:2px;background:${pcol(k)};display:inline-block"></i>${esc(k)} ${v}</span>`).join('')}</div>`;
  const list=(limit?rows.filter(x=>rankLocal[x.r.c]<2||x.p.id===hl).slice(0,limit):rows);
  return `<div style="display:grid;gap:8px"><div><b>Corporación de ${esc(m.m)}</b><div style="color:var(--muted);font-size:.8rem">${rows.length} membros · ${esc(m.pr)}</div></div>${bar}
    <ul class="corp">${list.map(x=>`<li><a href="#p-${x.p.id}">${x.p.id===hl?'<b>'+esc(x.p.n)+'</b>':esc(x.p.n)}</a><span>${esc(cargoLocal(x.r.c,x.p.s))} · ${esc(x.r.pa)}</span></li>`).join('')}</ul>

function remapAll(){

  for(const k in DATA.corp) DATA.corp[k]=m(DATA.corp[k]);
  for(const y in DATA.corpE) for(const k in DATA.corpE[y]) DATA.corpE[y][k]=m(DATA.corpE[y][k]);
  for(const k in (DATA.alc||{})) DATA.alc[k]=m(DATA.alc[k]);
  for(const k in (DATA.dp||{})){const D=DATA.dp[k]; D.membros=m(D.membros); if(D.ini) D.ini=m(D.ini); if(D.presidente) D.presidente=rid(D.presidente); (D.presidentes||[]).forEach(x=>x[0]=rid(x[0]));}
  DATA.p.forEach(p=>p.r.forEach(r=>{if(r.su) r.su=rid(r.su);}));

function mergeInto(K,M){
  // rexistros por ficha orixinal (ID): os que cheguen despois noutros bloques van ao seu sitio (addRecs)
  if(!K._parts) K._parts=new Map([[K.id,K.r]]);
  (M._parts||new Map([[M.id,M.r]])).forEach((v,id)=>{ const L=K._parts.get(id); if(L) L.push(...v); else K._parts.set(id,v); });
  K.r=[].concat(...K._parts.values());
  const alt=[...new Set([...(K.alt||[]),M.n,...(M.alt||[])])].filter(x=>x!==K.n); if(alt.length) K.alt=alt; else delete K.alt;
  delete K.hom;
  K.mu=(K.mu||[]).concat([[M.id,M.n]],M.mu||[]);
  ['s','y','nl'].forEach(f=>{if(!K[f]&&M[f]) K[f]=M[f];});
  for(const k in BYID) if(BYID[k]===M) BYID[k]=K;
  BYID[M.id]=K; DATA.p=DATA.p.filter(p=>p!==M);
  MERGED.delete(M); MERGED.add(K);
  K._s=Math.max(K._s,M._s); K._a|=M._a; keyBase(K); AMBC[K._c]=K._a; DEAD[M._c]=1;  // puntuación e tipos con todos os rexistros (veñen no índice)
  K._xm=[...(K._xm||[K._x]),...(M._xm||[M._x])];  // a busca de K inclúe a de M
}
function applyUnions(){
  let ch=false; UNI_ok=0; UNI_ko=0;
  for(const [mid,u] of Object.entries(UNI)){
    const K=BYID[u.keep], M=BYID[mid];
    if(!K||!M){UNI_ko++; continue;}
    if(K===M){UNI_ok++; continue;}
    mergeInto(K,M); UNI_ok++; ch=true;
  }
  if(ch){remapAll(); buildIndex();}
  return ch;
}

async function doUnion(keepId,mergeId,btn){

  catch(e){ if(btn){btn.disabled=false; btn.textContent='Non se puido gardar';} }
}
async function doDiscard(a,b,btn){

const CACODE={'Andalucía':'and','Aragón':'ara','Canarias':'can','Castilla y León':'cyl','Castilla-La Mancha':'clm','Cataluña':'cat','Comunitat Valenciana':'val','Extremadura':'ext','Galicia':'gal','País Vasco':'pva'};

// provincias de cada comunidade con máis dunha (as que teñen total propio no Congreso)
const CAP={}; INE_CA.forEach(([ca,pl])=>{ if(pl.length>1) CAP[ca]=pl.map(x=>x[0]); });
function grCA(y,ca){
  if(!CAP[ca]) return null;
  const K=DATA.gr||{}, key=y+'|'+ca; if(K[key]) return K[key];
  const parts=CAP[ca].map(p=>K[y+'|'+p]).filter(Boolean); if(!parts.length) return null;
  const t=[0,0,0,0,0,0], agg={};
  parts.forEach(R=>{ R.t.forEach((v,i)=>t[i]+=v); R.l.forEach(x=>{ const g=agg[x[1]]||(agg[x[1]]={ca:x[0],sg:x[1],v:0,s:0,mx:0}); g.v+=x[2]; g.s+=x[4]; if(x[2]>g.mx){g.mx=x[2]; g.ca=x[0];} }); });
  const l=Object.values(agg).sort((a,b)=>b.v-a.v).map(g=>[g.ca,g.sg,g.v,Math.round(10000*g.v/t[2])/100,g.s]);
  return (K[key]={t,l,agg:true});
}

}

const unitsWhere=f=>UN.map((u,k)=>f(u)?k:-1).filter(k=>k>=0);
const rgOf=ine=>PR_CA[String(ine).slice(0,2)];
function needUnits(h){
  if(fullDone()) return [];
  let m;
  const L=f=>unitsWhere(u=>u.g==='L'&&f(u)), S=f=>unitsWhere(u=>u.g==='S'&&f(u));
  if(h==='revisar') return UN.map((u,k)=>k);
  if(h.startsWith('p-')) return personUnits(h.slice(2));
  if((m=h.match(/^c-(\d{5})/))) return GALC.includes(m[1].slice(0,2))?L(u=>u.rg===rgOf(m[1])):L(u=>u.y===LATEST&&u.rg===rgOf(m[1]));
  if((m=h.match(/^e-M(\d{4})-(\d{5})/))) return L(u=>u.y===periodOf(m[1])&&u.rg===rgOf(m[2]));
  if((m=h.match(/^e-[AGNU](\d{4})/))){ const p=periodOf(m[1]); return S(u=>u.y===p||u.y===p+4); }  // mandatos que pasan ao período seguinte
  if((m=h.match(/^d-(\d\d)-(\d{4})/))) return L(u=>u.y===periodOf(m[2])&&u.rg===PR_CA[m[1]]);
  if(h.startsWith('pr-')||h.startsWith('ca-')) return [...S(()=>true),...L(u=>u.rg==='12')];
  return [];
}

function filterUnits(){

  else y=String(LATEST);

  const p=periodOf(y), rg=state.ccaa?CAINE[state.ccaa]:null;
  return grp==='loc'||grp==='prov'?unitsWhere(u=>u.g==='L'&&u.y===p&&(!rg||u.rg===rg)):unitsWhere(u=>u.g==='S'&&(u.y===p||u.y===p+4));
}

const DIRC=new Map();
function idBucket(id){ let h=0; for(const c of String(id)) h=(Math.imul(h,31)+c.charCodeAt(0))>>>0; return h%MANIFEST.dir.length; }  // = id_bucket
function personUnits(id){
  const p=BYID[id], ids=new Set([id]);
  if(DATA.rd&&DATA.rd[id]) ids.add(DATA.rd[id]);
  if(p) for(const [mid,u] of Object.entries(UNI)) if(BYID[u.keep]===p||u.keep===id) ids.add(mid).add(u.keep);
  const out=new Set(); let wait=false;
  for(const x of ids){ const b=idBucket(x), D=DIRC.get(b);
    if(!D){ wait=true; if(!DIRC.has('w'+b)){ DIRC.set('w'+b,1); getBuf(MANIFEST.dir[b]).then(readJSON).then(o=>{ DIRC.set(b,o); if(location.hash==='#p-'+id) route(); }).catch(()=>DIRC.delete('w'+b)); } continue; }
    (D[x]||[]).forEach(k=>out.add(k)); }

}

// ---- Carga por bloques (v105) ----
// Os datos van en bloques (grupo S supramunicipal / L local, período de catro anos, rexión; ver build_portal_gz.py),
// cada un co seu índice de busca e as súas táboas de resultados. Orde de carga (MANIFEST.u xa vén nela):
//  1) supramunicipais do último período → primeiro pintado; 2) locais do último período, en toda España;
//  3) en segundo plano, cara atrás, mentres non se pase do presuposto de rexistros (BUDGET, segundo a memoria);
//  o resto cárgase cando o pide unha páxina (needUnits), un filtro (filterUnits) ou o botón da busca (loadAll).
// Unha persoa vai en cada bloque onde ten rexistros: aquí xúntanse polo ID (addEntries).
// Ficheiros .gz descomprimidos no navegador (DecompressionStream) e gardados en IndexedDB:
// cada nome leva un hash do contido, así que nas visitas seguintes non se volven descargar.
const UN=MANIFEST.u, LATEST=UN[0].y, LOADED=new Set(), LD=new Map(), FETCH=new Map();
const BUDGET=window.RPG_BUDGET||(()=>{ const m=navigator.deviceMemory; return m>=8?3e6:m>=4?1.8e6:m?1e6:1.5e6; })();  // rexistros (RPG_BUDGET: para probas)
const periodOf=y=>{ y=parseInt(y,10); return y<1979?1975:1979+4*Math.floor((y-1979)/4); };      // = period()
const fullDone=()=>LOADED.size===UN.length;
let DV=0, ADDING=0, BG={done:false,stopped:false};
const recLoaded=()=>[...LOADED].reduce((a,k)=>a+UN[k].r,0), recAll=UN.reduce((a,u)=>a+u.r,0);
function covered(){ // período máis antigo desde o que está todo cargado
  let y=null; for(const p of [...new Set(UN.map(u=>u.y))].sort((a,b)=>b-a)){ if(UN.every((u,k)=>u.y!==p||LOADED.has(k))) y=p; else break; } return y; }
function loadMsg(){
  const pc=Math.round(100*recLoaded()/(BG.stopped?recLoaded()||1:recAll)), cy=covered();
  return cy?`<b>Cargando eleccións anteriores</b>… ${pc} %. Ata entón, as buscas inclúen as eleccións desde ${cy}.`
    :`<b>Cargando as eleccións municipais e os cargos locais de ${LATEST}</b>… ${pc} %. Ata entón, as buscas só inclúen as eleccións e cargos supramunicipais desde ${LATEST}.`;
}

const CACHE=(()=>{ let dbp=null;
  const open=()=>dbp||(dbp=new Promise((ok,ko)=>{ try{ const q=indexedDB.open('rexistro-politico',1); q.onupgradeneeded=()=>q.result.createObjectStore('f'); q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(q.error);}catch(e){ko(e);} }));
  const tx=(mode,fn)=>open().then(db=>new Promise((ok,ko)=>{ const t=db.transaction('f',mode); const r=fn(t.objectStore('f')); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>ko(t.error); }));
  return { get:k=>tx('readonly',s=>s.get(k)).catch(()=>null), put:(k,v)=>tx('readwrite',s=>{s.put(v,k);}).catch(()=>{}),
    prune:keep=>tx('readwrite',s=>{ const q=s.getAllKeys(); q.onsuccess=()=>q.result.forEach(k=>{ if(!keep.includes(k)) s.delete(k); }); }).catch(()=>{}) };
})();
async function getBuf(f){
  const c=await CACHE.get(f); if(c) return c;
  let err; for(let i=0;i<3;i++){ try{ const r=await fetch(f); if(!r.ok) throw new Error(r.status); const b=await r.arrayBuffer(); CACHE.put(f,b); return b; }catch(e){ err=e; await new Promise(z=>setTimeout(z,800*(i+1))); } }
  throw err;
}
async function readJSON(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0x1f&&u[1]===0x8b) return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  return JSON.parse(new TextDecoder().decode(u)); // o servidor xa o descomprimiu
}
async function readBin(buf){
  const u=new Uint8Array(buf);
  return u[0]===0x1f&&u[1]===0x8b?new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer():buf;
}

        for(const r of e.r) if(r.t==='A') (alc[r.ine]=alc[r.ine]||[]).includes(e.id)||alc[r.ine].push(e.id);
        if(!p){ e._x=x; e._s=X.score[j]; e._o=X.rank[j]; e._q=X.seq[j]; e._a=X.amb[j]; e._c=ALLP.length; ALLP.push(e); keyBase(e); AMBC[e._c]=e._a; BYID[e.id]=e; DATA.p.push(e); }
        else { addRecs(p,e); (p._xm||(p._xm=[p._x])).push(x); if(X.score[j]>p._s) p._s=X.score[j]; p._a|=X.amb[j]; AMBC[p._c]=p._a; }
      }
      SORTED=false; DV++;
      await pause();
    }
  } finally { ADDING--; }
}
function partDone(k){ const X=IX[k]; if(X.loaded!==X.n) throw new Error('índice de busca: '+X.loaded+' persoas de '+X.n); }
// fichas unidas: os IDs dos bloques novos (táboas, alcaldías, substitucións) pasan á ficha que queda
function remapUnit(t,arr){
  if(!MERGED.size) return; const m=a=>[...new Set((a||[]).map(rid))];
  for(const y in ((t||{}).corpE||{})) for(const ine in t.corpE[y]) DATA.corpE[y][ine]=m(DATA.corpE[y][ine]);
  for(const e of arr) for(const r of e.r){ if(r.su) r.su=rid(r.su); if(r.t==='A'&&DATA.alc[r.ine]) DATA.alc[r.ine]=m(DATA.alc[r.ine]); }
}
function prefetch(k){ if(k<UN.length&&!FETCH.has(k)&&!LD.has(k)){ const u=UN[k], f=Promise.all([getBuf(u.f),getBuf(u.x)]); f.catch(()=>FETCH.delete(k)); FETCH.set(k,f); } }
function loadUnit(k){
  if(LD.has(k)) return LD.get(k);
  prefetch(k);
  const pr=(async()=>{
    const [jb,xb]=await FETCH.get(k); FETCH.delete(k);
    const j=await readJSON(jb);
    mergeTables(j.t); ixPart(k,await readBin(xb));
    await addEntries(j.p,k); partDone(k);
    LOADED.add(k); DV++; SORTED=false; linkRedirects();
    if(!(Object.keys(UNI).length&&applyUnions())) remapUnit(j.t,j.p);
    if(fullDone()){ FULL=true; window.__fullyLoaded=true; }
  })();
  LD.set(k,pr); pr.catch(()=>LD.delete(k));
  return pr;
}
// botón «Buscar tamén nas anteriores»: o que quede, sen presuposto
let LOADALL=false;
async function loadAll(){
  if(LOADALL) return; LOADALL=true; showProgress(); renderIfHome();
  try{ for(let k=0;k<UN.length;k++) if(!LOADED.has(k)){ prefetch(k+1); await loadUnit(k); showProgress(); } }
  finally{ LOADALL=false; renderIfHome(); }
}
document.addEventListener('click',e=>{ if(e.target.id==='loadall') loadAll(); });
function renderIfHome(){ const h=location.hash.slice(1), a=document.activeElement; if((!h||h==='inicio')&&!(a&&a.tagName==='SELECT')) renderSearch(); }
function footer(d){
  $('#foot').innerHTML=`<p class="errfoot">Atopaches un erro ou un dato incorrecto? <button type="button" class="errbtn" data-err="1">Informar dun erro</button></p><details class="fontes"><summary><b>Fontes</b> (${d.meta.fontes.length}) · datos a ${fmtD(d.meta.actualizado)} · versión ${PORTAL_VER}</summary><ul>${d.meta.fontes.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></details><p>As fichas unen diversos rexistros de forma semiautomática polo nome completo. Poden existir inexactitudes e homónimos mal tratados.</p>`;
}
async function load(){
  const T0=performance.now();
  app.innerHTML='<p class="empty">Cargando o rexistro…</p>';
  if(typeof DecompressionStream==='undefined'){ app.innerHTML='<p class="empty">Este navegador é demasiado antigo para abrir o rexistro. Actualízao (Chrome/Edge 80+, Firefox 113+, Safari 16.4+).</p>'; return; }
  ixStart();
  const d0=getBuf(MANIFEST.d0); prefetch(0); prefetch(1);
  const d=await readJSON(await d0);
  DATA=d; d.p=[]; d.alc={}; P=d.p;
  const nE=UN.reduce((a,u)=>a+u.n,0); KB=new Float64Array(nE); DEAD=new Uint8Array(nE); AMBC=new Uint16Array(nE); ['ml','mr','corpE','ar','gr','nr','ur'].forEach(n=>{ d[n]=d[n]||{}; });
  (d.circ||[]).forEach(x=>{CIRC[x[0]]=x[1]; CIRCR[x[1]]=x[0];}); CIRC['España']='es'; CIRCR['es']='España'; CIRC['Cataluña']='cat'; CIRCR['cat']='Cataluña'; Object.entries(CACODE).forEach(([ca,k])=>{CIRC[ca]=k; CIRCR[k]=ca;});
  footer(d);
  try{
    // 1) supramunicipais do último período
    await loadUnit(0);
    route();
    console.log('T primeiro pintado', Math.round(performance.now()-T0), 'ms;', P.length, 'persoas');
    // 2) locais do último período (todas as comunidades)
    const lat=unitsWhere(u=>u.y===LATEST);
    lat.forEach(prefetch);
    for(const k of lat){ await loadUnit(k); showProgress(); }
    renderIfHome();
    console.log('T último período', Math.round(performance.now()-T0), 'ms;', P.length, 'persoas');
    // 3) cara atrás, ata o presuposto
    for(let k=0;k<UN.length;k++){
      if(LOADED.has(k)) continue;
      if(recLoaded()+UN[k].r>BUDGET){ BG.stopped=true; break; }
      prefetch(k+1); prefetch(k+2);
      await loadUnit(k); showProgress();
    }
  }catch(e){
    console.error(e);
    document.querySelectorAll('.loadbar').forEach(x=>x.innerHTML='<b>Non se puideron cargar todos os datos.</b> Recarga a páxina para tentalo de novo.');
    if(!LOADED.size){ app.innerHTML='<p class="empty">Non se puideron cargar os datos. Recarga a páxina.</p>'; }
    return;
  }
  BG.done=true;
  console.log('T carga completa', Math.round(performance.now()-T0), 'ms;', P.length, 'persoas;', LOADED.size, 'de', UN.length, 'bloques');
  const h=location.hash.slice(1);
  if(!h||h==='inicio') renderIfHome(); else route();
  CACHE.prune([MANIFEST.d0,...UN.flatMap(u=>[u.f,u.x]),...MANIFEST.dir]);
  initUnions().catch(()=>{});
}
load().catch(e=>{ console.error(e); app.innerHTML='<p class="empty">Non se puideron cargar os datos. Recarga a páxina.</p>'; });
})();
